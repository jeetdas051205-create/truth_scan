<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthScan AI — Analysis Result</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <div class="max-w-md w-full p-8 rounded-2xl bg-slate-900/80 border border-slate-800 text-center shadow-2xl">
    <div class="w-14 h-14 mx-auto mb-4 rounded-xl flex items-center justify-center {% if result == 'REAL' %}bg-emerald-500/20 text-emerald-400{% else %}bg-rose-500/20 text-rose-400{% endif %}">
      {% if result == 'REAL' %}
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      {% else %}
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      {% endif %}
    </div>

    <h1 class="text-xs font-mono uppercase tracking-widest text-slate-400 mb-1">Classification Result</h1>
    <div class="text-3xl font-extrabold mb-2 {% if result == 'REAL' %}text-emerald-400{% else %}text-rose-400{% endif %}">{{ result }}</div>
    <div class="text-sm font-mono text-slate-300 mb-6">Model Confidence: <span class="font-bold text-white">{{ confidence }}%</span></div>

    <a href="/" class="inline-block px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs tracking-wide transition-all shadow-lg shadow-indigo-600/30">
      &larr; Return to TruthScan Studio
    </a>
  </div>
</body>
</html>
